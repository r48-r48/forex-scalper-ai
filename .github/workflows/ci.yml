name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python 3.11 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ml]"

      - name: Compile
        run: PYTHONPYCACHEPREFIX=/tmp/scalper_ai_pycache python -m compileall src tests scripts

      - name: Test
        run: python -m pytest

      - name: MT5 preflight is safe without secrets
        run: python scripts/mt5_smoke.py --config-name mt5 --preflight-only
