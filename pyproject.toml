[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "forex-scalper-ai"
version = "0.1.0"
description = "Production-grade AI scalping agent framework for Forex research, simulation, and execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Codex" }
]
dependencies = [
  "duckdb>=1.1,<2.0",
  "numpy>=1.26,<3.0",
  "orjson>=3.10,<4.0",
  "pandas>=2.2,<3.0",
  "pyarrow>=16,<20",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0.2,<7.0",
  "redis>=5.0,<6.0",
  "tenacity>=8.5,<9.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
ml = [
  "torch>=2.5,<3.0",
]
dev = [
  "mypy>=1.11,<2.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.11,<1.0",
  "types-PyYAML>=6.0.12.20240917",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scalper_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.mypy]
python_version = "3.11"
plugins = []
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
mypy_path = ["src"]
